<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index_data/css/reset.css">
    <link rel="stylesheet" href="./index_data/css/style.css">
    <title>ListImages</title>
</head>
<body>
    <section class="ListIntro">
        <div>
            <div class="containerTitle">
                <h2 class="titleIndex">File images list!</h2>
                <form action="/" method="GET">
                    <button type="submit" class="exitHome">на головну сторінку</button>
                </form>
            </div>
            <!-- <p class="uploadText">Таблиця</p> -->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Filename</th>
                        <th>Original name</th>
                        <th>Size</th>
                        <th>Upload time</th>
                        <th>File type</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="images-table-body">
                </tbody>
            </table>
            <script>
                let currentPage = 1;
                const pageSize = 10;
                async function loadImages(page = 1) {
                    // змінюємо URL без перезагрузки сторінки
                    history.pushState(null, "", `/images-list?page=${page}`);
                    try {
                        const response = await fetch(`/images-list-data?page=${page}`);

                        if (!response.ok) {
                            throw new Error(`HTTP error: ${response.status}`);
                        }

                        const images = await response.json();

                        const tbody = document.getElementById("images-table-body");

                        tbody.innerHTML = "";

                        images.forEach(image => {
                            const row = document.createElement("tr");

                            row.innerHTML = `
                                <td>${image.id}</td>
                                <td>${image.filename}</td>
                                <td>${image.original_name}</td>
                                <td>${image.size}</td>
                                <td>${image.upload_time}</td>
                                <td>${image.file_type}</td>
                                <td>
                                    <button onclick="deleteImage(${image.id})" class="deleteList">
                                        Delete
                                    </button>
                                </td>
                            `;

                            tbody.appendChild(row);
                        });
                        // зберігаємо поточну сторінку
                        currentPage = page;
                        // викликаємо функцію оновлення пагінації
                        updatePagination(images);

                    } catch (error) {
                        console.error("Помилка завантаження зображень:", error);
                    }
                }

                function updatePagination(images) {
                    const pagination = document.getElementById("pagination");

                    pagination.innerHTML = "";

                    // кнопка "назад"
                    const prevButton = document.createElement("button");
                    prevButton.textContent = "Попередня сторінка";
                    prevButton.classList.add("paginationButton");
                    prevButton.disabled = currentPage === 1;

                    prevButton.onclick = () => {
                        if (currentPage > 1) {
                            loadImages(currentPage - 1);
                        }
                    };

                    pagination.appendChild(prevButton);


                    // номер поточної сторінки
                    const pageNumber = document.createElement("span");
                    pageNumber.textContent = ` сторінка: ${currentPage} `;
                    pageNumber.classList.add("pageNumber");
                    pagination.appendChild(pageNumber);


                    // кнопка "вперед"
                    const nextButton = document.createElement("button");
                    nextButton.textContent = "Наступна сторінка →";
                    nextButton.classList.add("paginationButton");
                    // якщо приходить меньше pageSize позицій, то це остання сторінка
                    nextButton.disabled = images.length < pageSize;

                    nextButton.onclick = () => {
                        loadImages(currentPage + 1);
                    };

                    pagination.appendChild(nextButton);
                }

                async function deleteImage(id) {
                    const response = await fetch(`/delete-list-image?id=${id}`, {
                        method: "DELETE"
                    });

                    if (!response.ok) {
                        console.error("Помилка видалення");
                    return;
                    }
                    // після видалення перезавантажуємо сторінку
                    loadImages(currentPage);
                }
                // Отримуємо page із адресної строчки
                const urlParams = new URLSearchParams(window.location.search);

                let initialPage = parseInt(urlParams.get("page")) || 1;

                // захист від page=<0, page=abc
                if (initialPage < 1) {
                    initialPage = 1;
                }

                // Завантажуємо сторінку з URL
                loadImages(initialPage);
            </script>
            <div id="pagination"></div>
            </div>
    </section>
</body>
</html>
